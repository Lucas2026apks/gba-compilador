name: Build GBA ROM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema y pacman de dkp
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 make libarchive-tools
          
          # Descargar e instalar el keyring y repositorio oficial de devkitPro
          wget https://github.com/devkitPro/pacman-packages/releases/download/keyring-2023-01-26/devkitpro-keyring.pkg.tar.xz
          sudo pacman -U --noconfirm devkitpro-keyring.pkg.tar.xz || sudo dkp-pacman -U --noconfirm devkitpro-keyring.pkg.tar.xz || true

      - name: Instalar devkitARM y Tonc
        run: |
          sudo dkp-pacman -Syu --noconfirm gba-dev gba-libtonc

      - name: Configurar variables de entorno y compilar
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${PATH}
          
          make

      - name: Subir ROM compilada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: juego-gba-rom
          path: "*.gba"
