name: Build GBA ROM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de devkitPro
        uses: devkitpro/actions/setup@v1

      - name: Instalar herramientas de GBA y Tonc
        run: |
          dkp-pacman -Syu --noconfirm gba-dev gba-libtonc

      - name: Compilar proyecto con Makefile
        run: |
          make

      - name: Subir ROM compilada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: juego-gba-rom
          path: "*.gba"
