name: Build GBA ROM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/base:latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de GBA (devkitARM y Tonc)
        run: |
          dmpm install gba-eabi tonc

      - name: Compilar proyecto con Makefile
        run: |
          make

      - name: Subir ROM compilada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: juego-gba-rom
          path: *.gba
