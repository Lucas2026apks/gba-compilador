name: Build GBA ROM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make

      - name: Upload .gba Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Granja-GBA-ROM
          path: granja.gba
          
